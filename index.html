<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Mini-Game</title>
    <!-- Connects our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Geometry Dash Mini-Game 🎮</h1>
        <p>Press <strong>SPACEBAR</strong> or <strong>CLICK / TAP</strong> the box to jump!</p>
    </header>

    <main>
        <section class="game-container">
            <!-- Game Canvas Element -->
            <canvas id="gameCanvas" width="600" height="300"></canvas>
            <p class="controls-hint">Tip: Time your jumps carefully to avoid the spikes!</p>
        </section>
    </main>

    <!-- Connects our JavaScript file AFTER HTML elements are rendered -->
    <script src="script.js"></script>
</body>
</html>
