<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Web Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GEOMETRY DASH 🎮</h1>
        <p>Press <strong>SPACEBAR</strong>, <strong>UP ARROW</strong>, or <strong>CLICK</strong> to Jump &amp; Hold to Auto-Jump!</p>
    </header>

    <main>
        <section class="game-wrapper">
            <!-- Progress Bar displaying level completion percentage -->
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar-fill"></div>
                <span id="progressText" class="progress-text">0%</span>
            </div>

            <!-- Main Canvas Game Area -->
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
