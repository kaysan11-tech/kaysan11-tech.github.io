<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Multi-Gamemode Web Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GEOMETRY DASH: ALL GAMEMODES 🎮</h1>
        <p>Current Gamemode: <strong id="modeDisplay" style="color:#a6ff00;">CUBE</strong></p>
    </header>

    <main>
        <section class="game-wrapper">
            <!-- Level Progress Bar -->
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar-fill"></div>
                <span id="progressText" class="progress-text">0%</span>
            </div>

            <!-- Game Canvas Screen -->
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            
            <p class="controls-hint">
                <strong>Cube:</strong> Click/Space to Jump | 
                <strong>Ship:</strong> HOLD to Fly Up | 
                <strong>Ball:</strong> Click/Space to Flip Gravity
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
