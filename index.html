<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <!-- Linking our CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1 id="main-title">Welcome to My Website!</h1>
        <p>I'm learning how to build and host my own site on GitHub Pages.</p>
    </header>

    <!-- Main Content Section -->
    <main>
        <section class="card">
            <h2>About Me</h2>
            <p>This is where you can write a short intro about yourself, your hobbies, or your favorite things.</p>
            
            <button id="magic-btn">Click for a Surprise!</button>
            <p id="message"></p>
        </section>
    </main>

    <!-- NEW: Reaction Minigame Widget pinned to the bottom-right corner -->
    <aside class="reaction-widget">
        <h3>⚡ Reaction Test</h3>
        <p class="game-instructions">Test your speed!</p>
        <!-- The interactive target box that changes color -->
        <div id="reaction-box" class="box-waiting">Click "Start" to begin!</div>
        <button id="start-game-btn">Start Game</button>
        <p id="game-result"></p>
    </aside>

    <!-- Linking our JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
