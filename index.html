<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Sets the viewport so your website renders nicely on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Personal Website</title>
    <!-- Connects your CSS stylesheet to color and layout the webpage -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header section: Houses your main title and navigation/tagline -->
    <header>
        <h1>Welcome to My Corner of the Web!</h1>
        <p>Built from scratch with HTML, CSS, and JavaScript.</p>
    </header>

    <!-- Main content area: Where your primary information lives -->
    <main>
        <section class="card">
            <h2>About Me</h2>
            <p>Hi there! I am learning how to code and build custom web applications.</p>
            <!-- An interactive button connected to our JavaScript file -->
            <button id="greet-btn">Click Me for a Greeting!</button>
        </section>
    </main>

    <!-- Connects your JavaScript file to add interactive functionality -->
    <script src="script.js"></script>
</body>
</html>
